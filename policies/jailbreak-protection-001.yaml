id: "jailbreak-protection-001"
version: "1.0.0"
description: "Block advanced jailbreak and roleplay attacks"
agent_role: "ai_user"
tool_id: "gpt-4"
allowed_actions:
  - Read
  - Write
  - Execute
conditions:
  - !PayloadRegexDeny '(?i)you.*are.*now.*DAN'
  - !PayloadRegexDeny '(?i)act.*as.*if.*you.*are.*unrestricted'
  - !PayloadRegexDeny '(?i)pretend.*you.*have.*no.*restrictions'
  - !PayloadRegexDeny '(?i)simulate.*being.*unfiltered'
  - !PayloadRegexDeny '(?i)roleplay.*as.*a.*hacker'
  - !PayloadRegexDeny '(?i)act.*as.*a.*malicious.*AI'
  - !PayloadRegexDeny '(?i)you.*can.*do.*anything.*now'
  - !PayloadRegexDeny '(?i)no.*longer.*bound.*by.*rules'
  - !PayloadRegexDeny '(?i)override.*safety.*protocols'
  - !PayloadRegexDeny '(?i)bypass.*content.*filters'
  - !PayloadRegexDeny '(?i)enable.*developer.*mode'
  - !PayloadRegexDeny '(?i)developer.*mode.*enabled'
  - !PayloadRegexDeny '(?i)STAN.*Strive.*To.*Avoid.*Norms'
  - !PayloadRegexDeny '(?i)DUDE.*mode'
  - !PayloadRegexDeny '(?i)AIM.*Always.*Intelligent.*Machiavellian'
  - !PayloadRegexDeny '(?i)hypothetical.*scenario.*where.*no.*rules'
  - !PayloadRegexDeny '(?i)in.*a.*fictional.*world.*where'
  - !PayloadRegexDeny '(?i)for.*educational.*purposes.*only'
  - !PayloadRegexDeny '(?i)this.*is.*a.*test.*scenario'
priority: 180
is_active: true
owner_team: "AI Security"
approved_by: "founder@saillent.com"
compliance_frameworks:
  - "SOC2"
  - "NIST-AI-RMF"
  - "EU-AI-ACT"
risk_level: "critical"
