id: "pii-protection-001"
version: "1.0.0"
description: "Block PII (SSN, Credit Card, Email) in LLM requests"
agent_role: "ai_user"
tool_id: "gpt-4"
allowed_actions:
  - Read
  - Write
  - Execute
conditions:
  - !PayloadRegexDeny "\b\d{3}-\d{2}-\d{4}\b"
  - !PayloadRegexDeny "\b\d{4}[-\s]?\d{4}[-\s]?\d{4}[-\s]?\d{4}\b"
  - !PayloadRegexDeny "\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b"
priority: 200
is_active: true
owner_team: "AI Security"
approved_by: "founder@saillent.com"
compliance_frameworks:
  - "SOC2"
  - "GDPR"
  - "HIPAA"
risk_level: "critical"
