id: "system-prompt-protection-001"
version: "1.0.0"
description: "Block system prompt extraction and repetition attacks"
agent_role: "ai_user"
tool_id: "gpt-4"
allowed_actions:
  - Read
  - Write
  - Execute
conditions:
  - !PayloadRegexDeny '(?i)repeat.*words.*above'
  - !PayloadRegexDeny '(?i)output.*system.*prompt'
  - !PayloadRegexDeny '(?i)show.*instructions'
  - !PayloadRegexDeny '(?i)reveal.*initial.*prompt'
  - !PayloadRegexDeny '(?i)what.*were.*you.*told.*to.*do'
  - !PayloadRegexDeny '(?i)ignore.*previous.*instructions'
  - !PayloadRegexDeny '(?i)disregard.*all.*prior'
  - !PayloadRegexDeny '(?i)forget.*everything.*before'
  - !PayloadRegexDeny '(?i)you.*are.*a.*GPT'
  - !PayloadRegexDeny '(?i)put.*them.*in.*code.*block'
  - !PayloadRegexDeny '(?i)output.*in.*markdown.*format'
priority: 150
is_active: true
owner_team: "AI Security"
approved_by: "founder@saillent.com"
compliance_frameworks:
  - "SOC2"
  - "GDPR"
  - "NIST-AI-RMF"
risk_level: "critical"
