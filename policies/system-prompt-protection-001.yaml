id: "system-prompt-protection-001"
version: "1.0.1"
description: "Block system prompt extraction and repetition attacks"
agent_role: "ai_user"
tool_id: "gpt-4"
allowed_actions:
  - Read
  - Write
  - Execute
conditions:
  - !PayloadRegexDeny '(?i)repeat.*the.*words.*above'
  - !PayloadRegexDeny '(?i)output.*your.*system.*prompt'
  - !PayloadRegexDeny '(?i)show.*your.*initial.*instructions'
  - !PayloadRegexDeny '(?i)reveal.*your.*initial.*prompt'
  - !PayloadRegexDeny '(?i)what.*were.*you.*initially.*told'
  - !PayloadRegexDeny '(?i)disregard.*all.*prior.*instructions'
  - !PayloadRegexDeny '(?i)forget.*everything.*before.*this'
  - !PayloadRegexDeny '(?i)you.*are.*a.*GPT.*model'
  - !PayloadRegexDeny '(?i)put.*them.*in.*a.*code.*block'
priority: 150
is_active: true
owner_team: "AI Security"
approved_by: "founder@saillent.com"
compliance_frameworks:
  - "SOC2"
  - "GDPR"
  - "NIST-AI-RMF"
risk_level: "critical"
