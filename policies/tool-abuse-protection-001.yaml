id: "tool-abuse-protection-001"
version: "1.0.0"
description: "Block dangerous shell commands (Part 1 of 2)"
agent_role: "ai_user"
tool_id: "gpt-4"
allowed_actions:
  - Read
  - Write
  - Execute
conditions:
  - !PayloadRegexDeny '(?i)execute_shell.*rm'
  - !PayloadRegexDeny '(?i)execute_shell.*sudo'
  - !PayloadRegexDeny '(?i)execute_shell.*chmod'
  - !PayloadRegexDeny '(?i)execute_shell.*wget'
  - !PayloadRegexDeny '(?i)execute_shell.*curl'
  - !PayloadRegexDeny '(?i)execute_shell.*bash'
  - !PayloadRegexDeny '(?i)execute_shell.*python'
  - !PayloadRegexDeny '(?i)rm\s+-rf'
  - !PayloadRegexDeny '(?i)/etc/passwd'
  - !PayloadRegexDeny '(?i)/etc/shadow'
priority: 175
is_active: true
owner_team: "AI Security"
approved_by: "founder@saillent.com"
compliance_frameworks:
  - "SOC2"
  - "MITRE-ATLAS"
risk_level: "critical"
