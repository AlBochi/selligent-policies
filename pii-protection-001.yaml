apiVersion: selligent.io/v1
kind: Policy
metadata:
  name: pii-protection-001
  version: 1.0.0
  description: "Block requests containing PII (SSN, Credit Card, Email)"
spec:
  type: request_filter
  priority: 100
  conditions:
    - type: regex_match
      field: "messages[*].content"
      patterns:
        - '\b\d{3}-\d{2}-\d{4}\b'  # SSN
        - '\b\d{4}[-\s]?\d{4}[-\s]?\d{4}[-\s]?\d{4}\b'  # Credit Card
        - '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'  # Email
  action: block
  response:
    status: 403
    body:
      error:
        code: "pii_detected"
        message: "Request blocked: PII detected in message content"
        type: "selligent_security_violation"
  logging:
    level: warn
    include_content: false
